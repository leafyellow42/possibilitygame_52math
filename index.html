<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가능성 베팅 게임</title>
<style>
  @font-face{font-family:'NeoDGM';src:url('fonts/neodgm.woff2') format('woff2');font-display:block}
  :root{--bg:#f4f1ea;--ink:#111111;--red:#d62b1f;--green:#17773f;--paper:#ffffff;--muted:#5a5650;--dim:#e2ded4;--dimline:#bdb7aa;--table:#e9e5dc}
  *{box-sizing:border-box;font-synthesis:none}
  html,body{margin:0;height:100%;background:#e9e5dc;overflow:hidden}
  body{font-family:'NeoDGM',monospace;font-weight:400;color:var(--ink);-webkit-font-smoothing:none}
  #viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{width:1280px;height:720px;flex:none;background:var(--bg);padding:26px 48px 24px;display:flex;flex-direction:column;gap:16px;transform-origin:center center;position:relative}
  .hd{font-family:'NeoDGM',monospace;font-weight:700}
  .px{font-family:'NeoDGM',monospace;font-weight:700}
  .box{background:var(--paper);border:6px solid var(--ink);box-shadow:8px 8px 0 var(--ink);position:relative}
  button{font:inherit}

  /* 홈 */
  .home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;border-top:8px solid var(--ink);border-bottom:8px solid var(--ink)}
  .home .tools{display:flex;gap:14px;margin-top:6px}
  .home h1{margin:0;font-size:92px;line-height:1.05}
  .kicker{font-size:26px;background:var(--ink);color:var(--paper);padding:6px 18px;letter-spacing:1px}
  .title{color:var(--ink);text-shadow:5px 5px 0 #d8d3c7;letter-spacing:2px;margin-top:4px !important}
  .icons{display:flex;gap:26px;align-items:center;margin-top:2px}
  .icons .ic{width:44px;height:44px;display:block;animation:bob 1.2s steps(2) infinite}
  .icons .ic:nth-child(2){animation-delay:.2s}.icons .ic:nth-child(3){animation-delay:.4s}.icons .ic:nth-child(4){animation-delay:.6s}.icons .ic:nth-child(5){animation-delay:.8s}
  .icons .ic svg{display:block;width:44px;height:44px}
  .icons .card7{width:32px;height:44px;border:4px solid var(--ink);background:var(--paper);font-family:'NeoDGM',monospace;font-weight:700;font-size:22px;display:flex;align-items:center;justify-content:center}
  @keyframes bob{0%{transform:translateY(0)}100%{transform:translateY(-6px)}}
  @media (prefers-reduced-motion: reduce){.icons .ic{animation:none}}
  .home .sub{font-size:28px;color:var(--muted)}
  .home .lbl{font-size:24px;margin-top:4px;color:var(--muted)}
  .setbox{display:flex;align-items:center;gap:26px}
  .stepbtn{width:84px;height:84px;border:6px solid var(--ink);background:var(--paper);box-shadow:6px 6px 0 var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;color:var(--ink)}
  .stepbtn:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--ink)}
  .stepbtn[disabled]{opacity:.35;cursor:default;transform:none}
  .num{width:210px;height:96px;display:flex;align-items:center;justify-content:center;font-size:92px;background:var(--paper);border:6px solid var(--ink);box-shadow:8px 8px 0 var(--ink)}
  .presets{display:flex;gap:14px}
  .chip{font-family:'NeoDGM',monospace;font-weight:700;font-size:24px;width:76px;height:50px;border:5px solid var(--ink);background:var(--paper);cursor:pointer;color:var(--ink)}
  .chip.on{background:var(--ink);color:var(--paper)}
  .playbtn{margin-top:6px;font-family:'NeoDGM',monospace;font-weight:700;font-size:42px;height:82px;padding:0 64px;border:6px solid var(--ink);background:var(--red);color:var(--paper);box-shadow:8px 8px 0 var(--ink);cursor:pointer;display:flex;align-items:center;gap:22px}
  .playbtn:active{transform:translate(5px,5px);box-shadow:3px 3px 0 var(--ink)}
  .note{font-size:22px;color:var(--muted)}

  /* 끝 */
  .endbox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;border-top:8px solid var(--ink);border-bottom:8px solid var(--ink)}
  .endbox .big{font-size:120px;line-height:1}
  .endbox .t{font-size:40px}
  .endbox .s{font-size:28px;color:var(--muted)}
  .endbox .row{display:flex;gap:24px;margin-top:16px}

  /* 게임 */
  .top{display:flex;align-items:center;justify-content:space-between;border-bottom:8px solid var(--ink);padding-bottom:10px;height:64px;flex:none}
  .logo{font-size:36px;line-height:1}
  .steps{display:flex;gap:10px;list-style:none;margin:0;padding:0}
  .steps li{font-size:20px;padding:5px 14px;border:4px solid var(--ink);background:var(--paper)}
  .steps li.on{background:var(--ink);color:var(--paper)}
  .count{font-size:30px}
  .count b{color:var(--red)}

  .stmt{flex:none;height:150px;display:flex;align-items:center;padding:0 36px}
  .stmt .count{position:absolute;top:10px;right:18px;font-size:24px;color:var(--muted)}
  .stmt h1{margin:0;font-size:44px;line-height:1.25}
  .stmt h1 span{color:var(--muted)}

  .body{flex:1 1 auto;min-height:0;display:flex;gap:28px}
  .toolbox{width:540px;flex:none;padding:10px 14px 12px;display:flex;flex-direction:column;gap:8px}
  .toolbox .ttl{font-size:21px;border-bottom:4px solid var(--ink);padding-bottom:5px}
  .host{flex:1 1 auto;min-height:0;position:relative;overflow:hidden}
  .cap{font-size:23px;text-align:center;line-height:1.25;min-height:29px;display:flex;align-items:center;justify-content:center}
  .cap.res{font-size:27px}
  .cap .mut{color:var(--muted);font-size:21px}
  .legend{display:flex;gap:14px;font-size:20px;color:var(--muted);align-items:center;justify-content:center;flex-wrap:wrap}
  .legend i{display:inline-block;width:18px;height:18px;border:3px solid var(--ink);vertical-align:-3px;margin-right:4px}
  .legend svg{vertical-align:-6px;margin-right:4px}

  .right{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:14px}
  .opts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;flex:none}
  .opt{height:110px;border:6px solid var(--ink);background:var(--paper);box-shadow:5px 5px 0 var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink);padding:0;position:relative}
  .opt .n{font-family:'NeoDGM',monospace;font-weight:700;font-size:18px}
  .opt .l{font-family:'NeoDGM',monospace;font-weight:700;font-size:29px;line-height:1.12;text-align:center}
  .opt:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
  .opt.wrong{background:var(--dim);color:var(--muted);border-color:var(--dimline);box-shadow:none;transform:translate(5px,5px);cursor:default}
  .opt.wrong .x{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .opt.right{background:var(--green);color:var(--paper);cursor:default}
  .opt.fade{opacity:.4;cursor:default}
  .opt.shake{animation:shake .32s steps(4)}
  @keyframes shake{0%,100%{translate:0}25%{translate:-10px}75%{translate:10px}}

  .reason{flex:none;height:40px;display:flex;align-items:center;font-size:27px}
  .reason.ok{color:var(--green)}
  .reason.no{color:var(--red)}

  .oxarea{flex:1 1 auto;min-height:0;display:flex;gap:24px}
  .ph{flex:1;border:5px dashed var(--dimline);display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--muted)}
  .noscore{flex:1;border:6px solid var(--ink);background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  .noscore .big{font-size:44px}
  .noscore .sm{font-size:24px;color:var(--muted)}
  .card{flex:1 1 0;border:6px solid var(--ink);background:var(--paper);box-shadow:8px 8px 0 var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:relative}
  .card .mk{font-size:84px;line-height:1}
  .card .ds{font-size:28px;line-height:1.2;text-align:center}
  .card .pt{font-size:52px;line-height:1}
  .card .pt small{font-family:'NeoDGM',monospace;font-weight:700;font-size:26px;margin-left:4px}
  .card.win{background:var(--green);color:var(--paper);animation:pop .35s steps(3)}
  .card.lose{opacity:.35;box-shadow:none;transform:translate(8px,8px)}
  .card .badge{position:absolute;top:-22px;left:20px;background:var(--paper);color:var(--green);border:5px solid var(--green);font-size:22px;padding:2px 12px}
  @keyframes pop{0%{transform:scale(1.08)}100%{transform:scale(1)}}

  .foot{flex:none;display:flex;justify-content:space-between;align-items:center;height:62px}
  .foot .grp{display:flex;gap:14px;align-items:center}
  .btn{font-family:'NeoDGM',monospace;font-weight:700;font-size:28px;padding:0 26px;height:58px;border:6px solid var(--ink);background:var(--paper);color:var(--ink);box-shadow:5px 5px 0 var(--ink);cursor:pointer;display:flex;align-items:center;gap:10px}
  .btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
  .btn.primary{background:var(--red);color:var(--paper)}
  .btn[disabled]{opacity:.4;cursor:default;transform:none}
  .btn.small{font-size:21px;height:48px;padding:0 16px;box-shadow:4px 4px 0 var(--ink);border-width:5px}
  .btn.big{font-size:36px;height:84px;padding:0 40px}
  .hint{font-size:24px;color:var(--muted)}
  .btn.quit.armed{background:var(--ink);color:var(--paper)}
  .soundbtn{position:absolute;bottom:44px;right:60px}

  /* 도구: 주사위 */
  .tray{position:absolute;inset:0;background:var(--table);border:5px solid var(--ink);box-shadow:inset 0 0 0 5px #d8d3c7}
  .d-pos,.d-shadow{position:absolute;left:50%;top:50%;width:var(--ds,56px);height:var(--ds,56px);margin:calc(var(--ds,56px) / -2) 0 0 calc(var(--ds,56px) / -2)}
  .d-persp{width:var(--ds,56px);height:var(--ds,56px);perspective:calc(var(--ds,56px) * 6.8)}
  .cube{width:var(--ds,56px);height:var(--ds,56px);position:relative;transform-style:preserve-3d}
  .face{position:absolute;inset:0;background:var(--ink)}
  .face svg{display:block;width:var(--ds,56px);height:var(--ds,56px)}
  .shade{position:absolute;inset:0;background:var(--ink);opacity:0}
  .d-shadow{background:rgba(17,17,17,.25)}
  /* 동전 */
  .floor{position:absolute;left:0;right:0;bottom:0;height:16px;background:var(--table);border-top:4px solid var(--ink)}
  .c-row{position:absolute;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:36px}
  .c-pos{width:var(--cs,96px);height:var(--cs,96px);position:relative}
  .c-persp{width:var(--cs,96px);height:var(--cs,96px);perspective:calc(var(--cs,96px) * 5.8)}
  .c-3d{width:var(--cs,96px);height:var(--cs,96px);position:relative;transform-style:preserve-3d}
  .c-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .c-face svg{display:block;width:100%;height:100%}
  .c-back{transform:rotateX(180deg)}
  .c-shadow{position:absolute;left:50%;bottom:-8px;width:88%;height:8px;margin-left:-44%;background:rgba(17,17,17,.22)}
  /* 회전판 */
  .wheelwrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  #wheel{transform-box:view-box;transform-origin:110px 130px}
  /* 공 */
  .drum{position:absolute}
  .drum svg{display:block;width:100%;height:100%}
  .paddle{position:absolute}
  .paddle i{position:absolute;top:0;height:100%;background:#bdb7aa}
  .paddle i+i{transform:rotate(90deg)}
  .pipe{position:absolute;border-left:6px solid var(--ink);border-right:6px solid var(--ink)}
  .ball{position:absolute;left:0;top:0;transform-origin:50% 100%}
  .ball svg{display:block;width:100%;height:100%}
  .bfloor{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--ink)}
  /* 카드 */
  .kcard{position:absolute;left:0;top:0;width:50px;height:70px;perspective:500px}
  .k-in{width:100%;height:100%;position:relative;transform-style:preserve-3d}
  .k-f,.k-b{position:absolute;inset:0;border:4px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .k-f{background:var(--paper);display:flex;align-items:center;justify-content:center;font-family:'NeoDGM',monospace;font-weight:700;font-size:26px}
  .k-b{transform:rotateY(180deg);background-color:var(--ink);background-image:repeating-linear-gradient(45deg,#d62b1f 0 4px,transparent 4px 10px)}
  .k-b::after{content:'';position:absolute;inset:5px;border:3px solid var(--paper)}

  /* 도움말 */
  .modal{position:absolute;inset:0;background:rgba(17,17,17,.55);display:flex;align-items:center;justify-content:center;z-index:50}
  .modal .box{width:1000px;padding:30px 40px;display:flex;flex-direction:column;gap:14px}
  .modal h2{margin:0;font-size:38px}
  .modal ul{margin:0;padding-left:26px;font-size:24px;line-height:1.55}
  .modal .close{align-self:flex-end}
  .tbox{width:1120px !important}
  .tcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px}
  .tcols h3{margin:6px 0 4px;font-size:26px}
  .tcols ul{font-size:20px !important;line-height:1.5 !important}
  .btn.rules{background:var(--ink);color:var(--paper)}
  /* 홈 B안 */
  .home2{flex:1;display:flex;margin:-26px -48px -24px}
  .home2 .hl{flex:1 1 56%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:28px;padding:0 64px;border-right:8px solid var(--ink)}
  .home2 .hr{flex:1 1 44%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:20px;background:#ebe7de;padding:0 40px}
  .home2 .title{margin:0;font-size:96px;line-height:1.1;color:var(--ink);text-shadow:5px 5px 0 #d8d3c7}
  .home2 .kicker{font-size:32px}
  .home2 .lbl{font-size:32px;color:var(--muted);margin:0}
  .home2 .icons .ic{width:48px;height:48px}
  .home2 .icons .ic svg{width:48px;height:48px}
  .home2 .playbtn{width:432px;justify-content:center;font-size:48px;margin:4px 0 0}
  .tools2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:432px}
  .tools2 .btn{justify-content:center}
  .tools2 .wide{grid-column:span 2}
  /* 게임 C안: 세로 선택지 → 정답 띠 */
  .vopts{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:10px}
  .vopts .opt{flex:1 1 0;height:auto;min-height:0;flex-direction:row;justify-content:flex-start;gap:22px;padding:0 26px}
  .vopts .opt .n{font-size:32px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--paper)}
  .vopts .opt .l{font-size:32px;line-height:1}
  .vopts .opt.wrong .n{background:var(--dimline)}
  .vopts .opt.wrong .x{inset:0 26px 0 auto;justify-content:flex-end}
  .vopts .opt.wrong .x svg{width:44px;height:44px}
  .pickstrip{flex:none;display:flex;flex-direction:column;justify-content:center;gap:6px;background:var(--green);color:var(--paper);border:6px solid var(--ink);padding:10px 22px;white-space:nowrap}
  .pickstrip .hd{font-size:32px}
  .pickstrip .rs{font-size:24px}
  .oxarea .card{flex-direction:column;justify-content:center;gap:14px;padding:12px}
  .oxarea .card .mk{font-size:112px}
  .oxarea .card .pt{font-size:64px}
  .oxarea .card .ds{font-size:32px}
  .oxarea .noscore .big{font-size:48px}
  .sbox{width:1060px !important;padding:26px 40px !important;gap:16px !important}
  .srow{display:flex;flex-direction:column;gap:10px}
  .shead{display:flex;align-items:baseline;gap:16px}
  .shead span{font-size:30px}
  .shead small{font-size:20px;color:var(--muted)}
  .sitems{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
  .sitem{display:flex;gap:18px;align-items:center;border:5px solid var(--ink);background:var(--bg);padding:12px 16px}
  .sitem img{display:block;width:84px;height:119px;border:2px solid var(--ink);background:#fff}
  .sinfo{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
  .sinfo b{font-size:30px}
  .sinfo span{font-size:20px;color:var(--muted)}
  .smsg{min-height:24px;font-size:20px;color:var(--red)}
  .tut{width:1120px !important;height:640px;padding:26px 44px !important;gap:12px !important}
  .thead{display:flex;justify-content:space-between;align-items:center;border-bottom:6px solid var(--ink);padding-bottom:10px}
  .thead h2{font-size:44px !important}
  .tbody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;min-height:0}
  .tfoot{display:flex;justify-content:space-between;align-items:center}
  .tdots{display:flex;gap:10px}
  .tdots span{width:16px;height:16px;border:3px solid var(--ink)}
  .tdots span.on{background:var(--ink)}
  .ttext{margin:0;font-size:32px;line-height:1.45;text-align:center}
  .ttext b{color:var(--ink);background:#e9e5dc;padding:0 6px}
  .ttext b.g{background:var(--green);color:var(--paper)}
  .tnote{margin:0;font-size:24px;color:var(--muted);text-align:center}
  .tflow{display:flex;align-items:center;gap:14px}
  .tstep{width:226px;height:170px;border:6px solid var(--ink);box-shadow:6px 6px 0 var(--ink);background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
  .tstep b{font-size:44px;width:64px;height:64px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center}
  .tstep span{font-size:27px;line-height:1.2;white-space:nowrap}
  .arrow{font-size:40px}
  .tstmt{border:6px solid var(--ink);background:var(--paper);padding:14px 40px;font-size:44px;line-height:1.25;text-align:left;min-width:640px}
  .tstmt span{color:var(--muted)}
  .ticons{display:flex;gap:30px;align-items:center}
  .ticons span{width:64px;height:64px;display:block}
  .ticons svg{display:block;width:64px;height:64px}
  .ticons .card7{width:46px;height:64px;border:4px solid var(--ink);background:var(--paper);font-family:'NeoDGM',monospace;font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center}
  .tscale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;width:960px}
  .tscale div{height:96px;border:6px solid var(--ink);background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:29px;line-height:1.15;text-align:center}
  .tscale div.on{background:var(--green);color:var(--paper)}
  .tdice{display:flex;gap:22px}
  .tdice span{width:84px;height:84px;display:block}
  .tdice svg{display:block;width:84px;height:84px}
  .tdice .lo{opacity:.3}
  .tdice .hl{outline:6px solid var(--green);outline-offset:6px}
  .tcards{display:flex;gap:28px;width:760px;height:130px}
</style>
</head>
<body>
<div id="viewport"><div id="stage" role="application" aria-label="가능성 베팅 게임"></div></div>

<script>
(function(){
  /* ================= 기본 설정 ================= */
  var LEVELS = ['불가능하다','~아닐 것<br>같다','반반이다','~일 것<br>같다','확실하다'];
  var LEVEL_PLAIN = ['불가능하다','~아닐 것 같다','반반이다','~일 것 같다','확실하다'];
  var TOOLS = ['dice','coin','spinner','balls','cards'];
  var RECENT_MAX = 25, MIN_Q = 5, MAX_Q = 40;
  var COLORS = [
    {id:'red',   name:'빨간색', fill:'#d62b1f'},
    {id:'black', name:'검은색', fill:'#111111'},
    {id:'white', name:'흰색',   fill:'#ffffff'}
  ];

  /* ================= 유틸 ================= */
  function ri(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
  function wait(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
  function anim(el, frames, opts){
    var a = el.animate(frames, Object.assign({fill:'forwards'}, opts));
    return a.finished.then(function(){ try{ a.commitStyles(); }catch(e){} a.cancel(); });
  }
  function batchim(w){
    var c = String(w).slice(-1);
    if (/[0-9]/.test(c)) return {'0':1,'1':1,'2':0,'3':1,'4':0,'5':0,'6':1,'7':1,'8':1,'9':0}[c]===1;
    var code = c.charCodeAt(0);

  /* ================= 도구 화면과 애니메이션 ================= */
  var VIEWS = {};

  // 주사위: 위에서 본 시점, 윗면이 결과
  VIEWS.dice = function(host){
    host.innerHTML='<div class="tray"></div><div class="d-shadow"></div><div class="d-pos"><div class="d-persp"><div class="cube"></div></div></div>';
    var cube=host.querySelector('.cube'), pos=host.querySelector('.d-pos'), sh=host.querySelector('.d-shadow');
    var S=Math.round(clamp(Math.min(host.clientWidth*0.19, host.clientHeight*0.28),56,110)), H=S/2;
    host.style.setProperty('--ds', S+'px');
    var FACES=[[1,'rotateY(0deg)'],[6,'rotateY(180deg)'],[3,'rotateY(90deg)'],[4,'rotateY(-90deg)'],[2,'rotateX(90deg)'],[5,'rotateX(-90deg)']];
    cube.innerHTML = FACES.map(function(f){ return '<div class="face" style="transform:'+f[1]+' translateZ('+H+'px)">'+dieFace(f[0])+'<div class="shade"></div></div>'; }).join('');
    var shades=[].slice.call(cube.querySelectorAll('.shade'));
    var normals=FACES.map(function(f){ var p=new DOMMatrix(f[1]).transformPoint(new DOMPoint(0,0,1)); return [p.x,p.y,p.z]; });
    var TARGET={1:[0,0],6:[0,180],3:[0,-90],4:[0,90],2:[-90,0],5:[90,0]};
    function easeIn(t){ return t*t; }
    function easeInOut(t){ return t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }
    function draw(st, dir, tgt){
      var rad=dir*Math.PI/180, ux=st.u*Math.cos(rad), uy=st.u*Math.sin(rad);
      var sc=(1+0.5*st.h+st.lift)*st.sq;
      pos.style.transform='translate('+ux.toFixed(1)+'px,'+uy.toFixed(1)+'px) scale('+sc.toFixed(3)+')';
      var rot='rotateZ('+dir+'deg) rotateX('+st.psi.toFixed(1)+'deg) rotateY('+st.phi.toFixed(1)+'deg) rotateX('+tgt[0]+'deg) rotateY('+tgt[1]+'deg)';
      cube.style.transform=rot;
      var so=S*(0.05+st.h*0.54+st.lift*0.46);
      sh.style.transform='translate('+(ux+so).toFixed(1)+'px,'+(uy+so).toFixed(1)+'px) rotate('+dir+'deg) scale('+(1+0.15*st.h).toFixed(3)+')';
      sh.style.opacity=(1-0.55*st.h).toFixed(2);
      var m=new DOMMatrix(rot);
      normals.forEach(function(n,i){ var w=m.transformPoint(new DOMPoint(n[0],n[1],n[2])); shades[i].style.opacity=clamp((1-w.z)*0.5,0,0.55).toFixed(2); });
    }
    function plan(){
      var k=2, segs=[], u=-(S+S*k)+0.7*S, phi=-90*(k+1);
      (function(u0,p0){
        var TL=0.55, DA=S, DH=S;
        function cubic(v){ var c2=3-2*v, c3=v-2; return function(x){ return v*x+c2*x*x+c3*x*x*x; }; }
        var bu=cubic(DA*(1-TL)/(TL*DH)), bp=cubic((1-TL)/TL);
        segs.push({d:760, f:function(t){
          var st={psi:0, lift:0};
          if (t<TL){ var x=t/TL; st.h=1-x*x; st.u=u0+DA*x; st.phi=p0+90*x; st.psi=-180*(1-x)*(1-x); }
          else { var q=(t-TL)/(1-TL); st.h=0.9*q*(1-q); st.u=u0+DA+DH*bu(q); st.phi=p0+90+90*bp(q); }
          st.sq=1-0.07*Math.exp(-Math.pow((t-TL)/0.035,2));
          return st;
        }});
      })(u,phi);
      u+=S+S; phi+=180;
      (function(u0,p0){ segs.push({d:260, f:function(t){ var e=easeInOut(t); return {u:u0+S*e, h:0, phi:p0+90*e, psi:0, lift:0.08*Math.sin(Math.PI*e), sq:1}; }}); })(u,phi);
      u+=S; phi+=90;
      (function(u0){ segs.push({d:280, f:function(t){ return {u:u0, h:0, phi:9*Math.sin(Math.PI*t)*(1-t), psi:0, lift:0, sq:1}; }}); })(u);
      return segs;
    }
    draw({u:0,h:0,phi:0,psi:0,lift:0,sq:1}, ri(-15,15), TARGET[ri(1,6)]);
    return { run:function(n){
      return new Promise(function(done){
        var tgt=TARGET[n], dir=(Math.random()<.5?0:180)+ri(-22,22);
        var segs=plan(), total=segs.reduce(function(a,s){return a+s.d;},0), t0;
        function frame(now){
          var el=now-t0, acc=0;
          for (var i=0;i<segs.length;i++){
            if (el<=acc+segs[i].d || i===segs.length-1){ draw(segs[i].f(clamp((el-acc)/segs[i].d,0,1)), dir, tgt); break; }
            acc+=segs[i].d;
          }
          if (el<total) requestAnimationFrame(frame); else { draw(segs[segs.length-1].f(1), dir, tgt); done(); }
        }
        Promise.all([anim(pos,[{opacity:1},{opacity:0}],{duration:160}), anim(sh,[{opacity:sh.style.opacity||1},{opacity:0}],{duration:160})]).then(function(){
          draw(segs[0].f(0), dir, tgt); pos.style.opacity=1; sh.style.opacity=0;
          SFX.dice(); t0=performance.now(); requestAnimationFrame(frame);
        });
      });
    }};
  };

  // 동전: 튀어 올라 뒤집히다 떨어짐
  VIEWS.coin = function(host, m){
    var html='<div class="floor"></div><div class="c-row">';
    for (var i=0;i<m.coins;i++) html+='<div class="c-pos"><div class="c-persp"><div class="c-3d">'+
      '<div class="c-face">'+coinFace('그림')+'</div><div class="c-face c-back">'+coinFace('숫자')+'</div></div></div><div class="c-shadow"></div></div>';

      return {body:p.querySelector('.c-persp'), c3d:p.querySelector('.c-3d'), sh:p.querySelector('.c-shadow'), ang:0};
    });
    async function toss(c, face, delay){
      await wait(delay);

      var start=c.ang%360, want=face==='그림'?0:180, end=start+360*4+(((want-start)%360)+360)%360, dur=1500;

          {transform:'translateY(0) scale(1)'}
        ],{duration:dur, easing:'ease-out'}),
        anim(c.sh,[{transform:'scaleX(1)',opacity:1},{transform:'scaleX(.45)',opacity:.35,offset:.42},{transform:'scaleX(1)',opacity:1,offset:.78},{transform:'scaleX(1)',opacity:1}],{duration:dur}),
        anim(c.c3d,[{transform:'rotateX('+start+'deg)'},{transform:'rotateX('+end+'deg)'}],{duration:dur*0.8, easing:'cubic-bezier(.2,.6,.35,1)'})
      ]);
      c.ang=end; c.c3d.style.transform='rotateX('+end+'deg)';
    }
    return { run:function(faces){ return Promise.all(coins.map(function(c,i){ return toss(c, faces[i], i*180); })); } };
  };

  // 회전판: 돌다가 멈춤
  VIEWS.spinner = function(host, m){
    host.innerHTML='<div class="wheelwrap">'+wheelSvg(m.cfg)+'</div>';
    var wh=Math.floor(Math.min(host.clientHeight-6, (host.clientWidth-10)*240/220)), wsv=host.querySelector('svg');
    wsv.setAttribute('height', wh); wsv.setAttribute('width', Math.floor(wh*220/240));
    var w=host.querySelector('#wheel'), rot=0;
    return { run:function(idx){
      var n=m.cfg.n, center=(idx+0.15+Math.random()*0.7)*360/n;
      var target=rot-(rot%360)+360*5+(360-center);
      w.getBoundingClientRect();
      w.style.transition='transform 3.2s cubic-bezier(.15,.75,.2,1)';
      w.style.transform='rotate('+target+'deg)';
      // 칸 경계를 지날 때마다 '딱' 소리 (같은 감속 곡선으로 계산)
      var from=rot, ticks=[], seg=360/n, nextB=Math.floor(from/seg+1)*seg;
      for (var k=1;k<=400;k++){
        var u=k/400, x=3*(1-u)*(1-u)*u*0.15+3*(1-u)*u*u*0.2+u*u*u, y=3*(1-u)*(1-u)*u*0.75+3*(1-u)*u*u+u*u*u;
        var a=from+(target-from)*y;
        while (a>=nextB){ ticks.push(Math.round(x*3200)); nextB+=seg; }
      }
      SFX.spinTicks(ticks);
      rot=target;
      return wait(3350);
    }};
  };

  // 공: 추첨기 안에서 섞이는 도중에 하나가 빠져나옴
  VIEWS.balls = function(host, m){
    host.innerHTML='<div class="bfloor"></div>';
    var W=host.clientWidth, Hh=host.clientHeight;
    var n=m.cfg.n, R=Math.min(130, Math.floor((Hh-50)/2), Math.floor(W*0.3)), B=Math.round((n>7?28:32)*R/84), FLOOR=Hh-4, CY=Math.max(R+4, FLOOR-B-40-R), CX=Math.round(W*0.36), RIN=R-B/2-8;
    var pipe=document.createElement('div'); pipe.className='pipe';
    var drum=document.createElement('div'); drum.className='drum'; drum.innerHTML=disc(24,'rgba(255,255,255,0.75)','#111111','추첨기');
    var paddle=document.createElement('div'); paddle.className='paddle'; paddle.innerHTML='<i></i><i></i>';
    host.appendChild(pipe); host.appendChild(drum); host.appendChild(paddle);
    var PL=Math.round(R*1.4);
    drum.style.cssText='left:'+(CX-R)+'px;top:'+(CY-R)+'px;width:'+(2*R)+'px;height:'+(2*R)+'px';
    paddle.style.cssText='left:'+(CX-PL/2)+'px;top:'+(CY-PL/2)+'px;width:'+PL+'px;height:'+PL+'px';
    [].forEach.call(paddle.querySelectorAll('i'), function(i){ i.style.left=(PL/2-6)+'px'; i.style.width='12px'; });
    pipe.style.cssText='left:'+(CX-B/2-10)+'px;width:'+(B+20)+'px;top:'+(CY+R-12)+'px;height:'+(FLOOR-B-(CY+R-12)+8)+'px';
    function tf(x,y,sc){ return 'translate('+(x-B/2).toFixed(1)+'px,'+(y-B/2).toFixed(1)+'px)'+(sc?' scale('+sc+')':''); }
    var balls=m.cfg.items.map(function(c,i){
      var el=document.createElement('div'); el.className='ball'; el.style.width=B+'px'; el.style.height=B+'px';
      el.innerHTML=disc(10, colorOf(c).fill, '#111111', colorOf(c).name+' 공');
      host.appendChild(el);
      return {el:el, x:CX-45+(i%4)*28, y:CY-20+Math.floor(i/4)*26, vx:0, vy:0, live:true};
    });
    var power=0, ang=0, running=false, last=0, active=false, rt=0;
    function step(dt){
      var live=balls.filter(function(b){return b.live;});
      live.forEach(function(b){
        b.vy+=900*dt;
        if (power>0){ b.vx+=(Math.random()-0.5)*5200*power*dt; b.vy+=((Math.random()-0.5)*5200-1100)*power*dt; }
        b.vx*=(1-0.6*dt); b.vy*=(1-0.6*dt);
        b.x+=b.vx*dt; b.y+=b.vy*dt;
        var dx=b.x-CX, dy=b.y-CY, d=Math.sqrt(dx*dx+dy*dy);
        if (d>RIN){ var nx=dx/d, ny=dy/d; b.x=CX+nx*RIN; b.y=CY+ny*RIN; var vn=b.vx*nx+b.vy*ny; if (vn>0){ b.vx-=1.75*vn*nx; b.vy-=1.75*vn*ny; b.vx*=0.92; b.vy*=0.92; } }
      });
      for (var i=0;i<live.length;i++) for (var j=i+1;j<live.length;j++){
        var a=live[i], c=live[j], ex=c.x-a.x, ey=c.y-a.y, dd=Math.sqrt(ex*ex+ey*ey)||0.01;
        if (dd<B-2){
          var ux=ex/dd, uy=ey/dd, ov=(B-2-dd)/2;
          a.x-=ux*ov; a.y-=uy*ov; c.x+=ux*ov; c.y+=uy*ov;
          var rv=(c.vx-a.vx)*ux+(c.vy-a.vy)*uy;
          if (rv<0){ var imp=-0.9*rv; a.vx-=imp*ux; a.vy-=imp*uy; c.vx+=imp*ux; c.vy+=imp*uy; }
        }
      }
    }
    function paint(){ balls.forEach(function(b){ if (b.live) b.el.style.transform=tf(b.x,b.y); }); paddle.style.transform='rotate('+ang.toFixed(1)+'deg)'; }
    function loop(now){
      var dt=Math.max(0,Math.min(0.033,(now-last)/1000)); last=now;
      for (var k=0;k<3;k++) step(dt/3);
      ang+=power*900*dt; paint();
      if (power>0.05){ rt-=dt*1000; if (rt<=0){ SFX.rattle(power); rt=35+Math.random()*55; } }
      var moving=balls.some(function(b){ return b.live && (Math.abs(b.vx)+Math.abs(b.vy))>8; });
      if (active || power>0 || moving) requestAnimationFrame(loop); else running=false;
    }
    function ramp(from,to,ms){
      return new Promise(function(done){ var t0=performance.now(); (function tick(now){ var p=Math.min(1,(now-t0)/ms); power=from+(to-from)*p; if(p<1) requestAnimationFrame(tick); else done(); })(t0); });
    }
    for (var s0=0;s0<240;s0++) step(1/60);
    balls.forEach(function(b){ b.vx=0; b.vy=0; }); paint();
    return { run: async function(idx){
      active=true; if (!running){ running=true; last=performance.now(); requestAnimationFrame(loop); }
      await ramp(0,1,350);
      await wait(1100);
      var b=balls[idx]; b.live=false; b.el.style.zIndex='3';
      var exitTop=[CX, CY+R-B/2-6], land=[CX, FLOOR-B/2], out=[Math.min(W-B, CX+120), FLOOR-B/2];
      SFX.ballDrop();
      var drop=(async function(){
        await anim(b.el,[{transform:tf(b.x,b.y)},{transform:tf(exitTop[0],exitTop[1])}],{duration:260,easing:'ease-in'});
        await anim(b.el,[{transform:tf(exitTop[0],exitTop[1])},{transform:tf(land[0],land[1])}],{duration:340,easing:'cubic-bezier(.55,0,1,.45)'});
        await anim(b.el,[{transform:tf(land[0],land[1])},{transform:tf(land[0],land[1]-10)},{transform:tf(land[0],land[1])}],{duration:200,easing:'ease-out'});
        await anim(b.el,[{transform:tf(land[0],land[1])},{transform:tf(out[0],out[1])}],{duration:650,easing:'cubic-bezier(.2,.7,.3,1)'});
        await anim(b.el,[{transform:tf(out[0],out[1])},{transform:tf(out[0],out[1],1.8)}],{duration:250,easing:'steps(3)'});
      })();
      var settle=(async function(){ await wait(700); await ramp(1,0,900); })();
      await Promise.all([drop, settle]);
      active=false;
    }};
  };

  // 카드: 뒤집어 섞은 뒤 한 장을 꺼내 뒤집음
  VIEWS.cards = function(host, m){
    var N=m.n, W=host.clientWidth, Hh=host.clientHeight;
    var cols = N<=5 ? N : Math.ceil(N/2), rows = N<=5 ? 1 : 2;
    var kz=clamp(Math.min((W-30)/(cols*50+(cols-1)*10), (Hh-40)/(rows*70+(rows-1)*10)*0.8), 1, 1.7);
    var CW=Math.round(50*kz), CH=Math.round(70*kz), G=Math.round(10*kz);
    var x0=(W-(cols*CW+(cols-1)*G))/2, y0=(Hh-(rows*CH+(rows-1)*G))/2;
    var slots=[]; for (var k=0;k<N;k++) slots.push([x0+(k%cols)*(CW+G), y0+Math.floor(k/cols)*(CH+G)]);
    var cx=W/2-CW/2, cy=Hh/2-CH/2;
    var cards=[];
    for (var i=1;i<=N;i++){
      var el=document.createElement('div'); el.className='kcard';
      el.style.width=CW+'px'; el.style.height=CH+'px'; el.style.fontSize='1px';
      el.innerHTML='<div class="k-in"><div class="k-f" aria-label="카드 '+i+'">'+i+'</div><div class="k-b" aria-hidden="true"></div></div>';
      el.querySelector('.k-f').style.fontSize=Math.round(26*kz)+'px';
      host.appendChild(el); cards.push({el:el, inn:el.querySelector('.k-in'), n:i});
    }
    function tf(x,y,sc){ return 'translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px) scale('+(sc||1)+')'; }
    cards.forEach(function(c,i){ c.x=slots[i][0]; c.y=slots[i][1]; c.el.style.transform=tf(c.x,c.y); });
    return { run: async function(num){
      cards.forEach(function(c,i){ SFX.cardFlip(i*35); });
      await Promise.all(cards.map(function(c,i){ return wait(i*35).then(function(){ return anim(c.inn,[{transform:'rotateY(0deg)'},{transform:'rotateY(180deg)'}],{duration:260,easing:'ease-in-out'}); }); }));
      await Promise.all(cards.map(function(c,i){ return anim(c.el,[{transform:tf(c.x,c.y)},{transform:tf(cx+(i-N/2)*1.5,cy-i*1.5)}],{duration:320,easing:'ease-in'}); }));
      SFX.swish(0);
      var order=shuffle(cards.map(function(_,i){return i;}));
      await Promise.all(cards.map(function(c,i){
        var side=order.indexOf(i)%2?1:-1;
        return anim(c.el,[{transform:tf(cx,cy)},{transform:tf(cx+side*46,cy+ri(-6,6))},{transform:tf(cx,cy)}],{duration:380,easing:'ease-in-out'});
      }));
      cards=shuffle(cards);
      cards.forEach(function(c,i){ SFX.cardFlip(i*40+200); });
      await Promise.all(cards.map(function(c,i){
        c.el.style.zIndex='';
        return wait(i*40).then(function(){ return anim(c.el,[{transform:tf(cx,cy)},{transform:tf(slots[i][0],slots[i][1])}],{duration:340,easing:'ease-out'}); })
          .then(function(){ c.x=slots[i][0]; c.y=slots[i][1]; });
      }));
      await wait(250);
      var pk=cards.filter(function(c){return c.n===num;})[0];
      pk.el.style.zIndex='10';
      cards.forEach(function(c){ if(c!==pk) anim(c.el,[{opacity:1},{opacity:.3}],{duration:300}); });
      var sc=Math.min(2.1,(Hh-10)/CH);
      await anim(pk.el,[{transform:tf(pk.x,pk.y)},{transform:tf(pk.x,pk.y-8,1.08),offset:.3},{transform:tf(cx,cy,sc)}],{duration:560,easing:'cubic-bezier(.3,.6,.3,1)'});
      SFX.reveal();
      await anim(pk.inn,[{transform:'rotateY(180deg)'},{transform:'rotateY(360deg)'}],{duration:420,easing:'ease-out'});
      pk.inn.style.transform='rotateY(0deg)';
    }};
  };

  /* ================= 캡션 ================= */
  function settingCaption(m){
    if (m.tool==='dice') return '';
    if (m.tool==='coin') return '<div class="legend"><span>'+coinFace('그림',26)+'그림 면</span><span>'+coinFace('숫자',26)+'숫자 면</span></div>';
    if (m.tool==='spinner' || m.tool==='balls'){
      var unit = m.tool==='spinner'?'칸':'개';
      return '<div class="legend">'+m.cfg.cols.map(function(id,i){ return '<span><i style="background:'+colorOf(id).fill+'"></i>'+colorOf(id).name+' '+m.cfg.counts[i]+unit+'</span>'; }).join('')+'</div>';
    }
    if (m.tool==='cards') return '';
  }
  function resultCaption(m,o){
    if (m.tool==='dice') return '윗면: '+iga(String(o))+' 나왔어요';

  function updateUI(){

  var dlCap; // undefined: 확인 전, null: 사용 불가

  }

  async function downloadSheet(x){

        await dl.save({filename:x.name, data:await r.blob()});
        if (msg) msg.textContent='';
      } catch(e){
        if (msg && (!e || e.code!=='declined')) msg.textContent='여기서는 내려받을 수 없어요. 게임 주소를 새 창에서 열어 다시 시도해 주세요.';
      }
      return;
    }
    var a=document.createElement('a'); a.href=x.file; a.download=x.name; a.rel='noopener';
    document.body.appendChild(a); a.click(); a.remove();
  }
  function modalHtml(){ return st.modal==='teacher' ? teacherHtml() : st.modal==='tutorial' ? tutorialHtml() : st.modal==='sheets' ? sheetsHtml() : ''; }
  async function runSim(){
    var m=st.q.made, final=pick(m.outcomes);
    st.phase='rolling'; updateUI();
    document.getElementById('cap').innerHTML='<span class="mut">...</span>';
    var myQ=st.q;
    await st.tool.run(final);
    if (st.q!==myQ || st.screen!=='game') return;
    st.outcome=final; st.phase='result';
    var cap=document.getElementById('cap'); cap.classList.add('res'); cap.innerHTML=resultCaption(m, final);
    SFX.win();
    updateUI();
  }

  /* ================= 조작 ================= */
  function act(name, el){
    if (SFX.isOn()) SFX.unlock();
    if (name==='sound'){ SFX.toggle(); if (st.screen==='home') renderHome(); else if (st.screen==='game') updateUI(); return; }
    if (name==='closeModal'){ st.modal=null; refresh(); return; }
    if (name==='tutPrev'){ if (st.tutIdx>0){ st.tutIdx--; SFX.blip(); refresh(); } return; }
    if (name==='tutNext'){ if (st.tutIdx<TUT.length-1){ st.tutIdx++; SFX.blip(); refresh(); } return; }
    if (name==='tutorial'){ st.modal='tutorial'; st.tutIdx=0; refresh(); return; }
    if (name==='teacher'){ st.modal='teacher'; refresh(); return; }
    if (name==='sheets'){ st.modal='sheets'; refresh(); return; }
    if (name==='dl'){ var sx=SHEETS[+el.getAttribute('data-i')]; if (sx){ SFX.blip(); downloadSheet(sx); } return; }
    if (st.modal) return;
    if (name==='full'){
      try { if (document.fullscreenElement) document.exitFullscreen(); else { var p=document.documentElement.requestFullscreen(); if (p&&p.catch) p.catch(function(){}); } } catch(e){}
      return;
    }
    if (st.screen==='home'){
      if (name==='dec'){ SFX.blip(); setN(st.N-1); }
      else if (name==='inc'){ SFX.blip(); setN(st.N+1); }
      else if (name==='preset'){ SFX.blip(); setN(+el.getAttribute('data-v')); }
      else if (name==='start') startGame();
      return;
    }
    if (st.screen==='end'){
      if (name==='home'){ st.modal=null; renderHome(); }
      else if (name==='again') startGame();
      return;
    }
    if (name==='pick'){
      if (st.phase!=='choose') return;
      var i=+el.getAttribute('data-i');
      if (st.wrong.indexOf(i)>=0) return;
      if (i===st.q.level){ SFX.right(); st.phase=(i===0||i===4)?'noscore':'bet'; updateUI(); }
      else { SFX.wrong(); st.wrong.push(i); updateUI(); var b=stage.querySelector('.opt[data-i="'+i+'"]'); if (b) b.classList.add('shake'); }
    }
    else if (name==='run'){ if (st.phase==='bet') runSim(); }
    else if (name==='next'){ if (st.phase==='noscore'||st.phase==='result'){ st.solved++; if (st.idx<st.N) SFX.next(); nextQuestion(); } }
    else if (name==='skip'){ if (st.phase!=='rolling'&&st.phase!=='result'){ SFX.blip(); loadQuestion(); } }
    else if (name==='quit'){
      if (st.phase==='rolling') return;
      if (!st.quitArm){
        st.quitArm=true; SFX.blip(); updateUI();
        var q0=st.q; setTimeout(function(){ if (st.quitArm && st.q===q0 && st.screen==='game'){ st.quitArm=false; updateUI(); } }, 3000);
      } else {
        st.quitArm=false;
        if (st.phase==='noscore'||st.phase==='result') st.solved++;
        renderEnd(true);
      }
    }
    else if (name==='home'){ if (st.phase!=='rolling') renderHome(); }
  }
  stage.addEventListener('click', function(e){
    var el=e.target.closest('[data-act]');
    if (el && !el.disabled) act(el.getAttribute('data-act'), el);
  });
  document.addEventListener('keydown', function(e){
    if (SFX.isOn()) SFX.unlock();
    if (st.modal){
      if (e.key==='Escape'){ st.modal=null; refresh(); }
      else if (st.modal==='tutorial' && (e.key==='ArrowRight'||e.key==='Enter'||e.key===' ')){ e.preventDefault(); if (st.tutIdx<TUT.length-1){ st.tutIdx++; SFX.blip(); } else st.modal=null; refresh(); }
      else if (st.modal==='tutorial' && e.key==='ArrowLeft'){ if (st.tutIdx>0){ st.tutIdx--; SFX.blip(); refresh(); } }
      return;
    }
    var k=e.key;
    if (st.screen==='home'){
      if (k==='ArrowRight'||k==='ArrowUp'){ e.preventDefault(); setN(st.N+1); }
      else if (k==='ArrowLeft'||k==='ArrowDown'){ e.preventDefault(); setN(st.N-1); }
      else if (k==='Enter'||k===' '){ e.preventDefault(); startGame(); }
      return;
    }
    if (st.screen==='end'){ if (k==='Enter'||k===' '){ e.preventDefault(); startGame(); } return; }
    if (k===' '||k==='Enter'){
      e.preventDefault();
      var p=stage.querySelector('[data-primary]:not([disabled])');
      if (p) act(p.getAttribute('data-act'), p);
    } else if (st.phase==='choose' && k>='1' && k<='5'){
      var o=stage.querySelector('.opt[data-i="'+(+k-1)+'"]');
      if (o && !o.disabled) act('pick', o);
    }
  });

  function fit(){ stage.style.transform='scale('+Math.min(window.innerWidth/1280, window.innerHeight/720)+')'; }
  window.addEventListener('resize', fit);
  fit();
  renderHome();
})();
</script>
</body>
